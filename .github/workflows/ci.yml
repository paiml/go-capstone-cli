name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gate:
    name: gate
    runs-on: [self-hosted, clean-room, X64, intel]
    steps:
      - uses: actions/checkout@v4
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: scripts/coverage-gate.sh
      - run: scripts/falsifier.sh
      - run: pv lint contracts
      - run: rmedia readme check .
      - run: scripts/leak-check.sh
